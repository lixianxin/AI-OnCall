<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 z" fill="#334155"/>
    </marker>
    <style>
      .bg{fill:#ffffff}
      .box{fill:#ffffff;stroke:#94a3b8;stroke-width:1.5;rx:12}
      .blue{fill:#eff6ff;stroke:#2563eb}
      .green{fill:#ecfdf5;stroke:#16a34a}
      .purple{fill:#f5f3ff;stroke:#7c3aed}
      .red{fill:#fef2f2;stroke:#dc2626}
      .yellow{fill:#fffbeb;stroke:#d97706}
      .label{font:600 18px 'Microsoft YaHei',Arial,sans-serif;fill:#111827}
      .small{font:400 14px 'Microsoft YaHei',Arial,sans-serif;fill:#475569}
      .line{stroke:#334155;stroke-width:1.8;fill:none;marker-end:url(#arrow)}
      .plain{stroke:#334155;stroke-width:1.8;fill:none}
      .note{font:400 14px 'Microsoft YaHei',Arial,sans-serif;fill:#334155}
    </style>
  </defs>
  <rect width="1200" height="980" class="bg"/>

  <!-- login flow -->
  <rect x="90" y="45" width="155" height="58" class="box blue"/>
  <text x="167.5" y="80" text-anchor="middle" class="label">登录</text>

  <rect x="305" y="45" width="170" height="58" class="box"/>
  <text x="390" y="80" text-anchor="middle" class="label">账号密码校验</text>

  <rect x="535" y="45" width="170" height="58" class="box"/>
  <text x="620" y="80" text-anchor="middle" class="label">生成随机 Token</text>

  <rect x="765" y="45" width="185" height="58" class="box green"/>
  <text x="857.5" y="80" text-anchor="middle" class="label">写入 auth_sessions</text>

  <rect x="1010" y="45" width="150" height="58" class="box blue"/>
  <text x="1085" y="70" text-anchor="middle" class="label">返回客户端</text>
  <text x="1085" y="91" text-anchor="middle" class="small">Bearer Token</text>

  <path d="M245 74 L305 74" class="line"/>
  <path d="M475 74 L535 74" class="line"/>
  <path d="M705 74 L765 74" class="line"/>
  <path d="M950 74 L1010 74" class="line"/>

  <!-- separator -->
  <line x1="80" y1="155" x2="1120" y2="155" stroke="#e2e8f0" stroke-width="2"/>

  <!-- request flow -->
  <rect x="80" y="205" width="210" height="62" class="box blue"/>
  <text x="185" y="230" text-anchor="middle" class="label">后续请求携带 Token</text>
  <text x="185" y="252" text-anchor="middle" class="small">Authorization: Bearer ...</text>

  <rect x="370" y="205" width="210" height="62" class="box purple"/>
  <text x="475" y="230" text-anchor="middle" class="label">查 Redis</text>
  <text x="475" y="252" text-anchor="middle" class="small">token_hash 查询缓存</text>

  <rect x="670" y="195" width="155" height="82" class="box yellow"/>
  <text x="747.5" y="230" text-anchor="middle" class="label">是否命中</text>
  <text x="747.5" y="253" text-anchor="middle" class="small">CurrentUser 缓存</text>

  <rect x="930" y="205" width="170" height="62" class="box purple"/>
  <text x="1015" y="230" text-anchor="middle" class="label">取出 CurrentUser</text>
  <text x="1015" y="252" text-anchor="middle" class="small">缓存命中</text>

  <rect x="600" y="360" width="280" height="78" class="box green"/>
  <text x="740" y="390" text-anchor="middle" class="label">查 PostgreSQL</text>
  <text x="740" y="414" text-anchor="middle" class="small">session / 用户 / 权限 / 团队</text>

  <rect x="640" y="505" width="190" height="78" class="box yellow"/>
  <text x="735" y="536" text-anchor="middle" class="label">token 是否有效</text>
  <text x="735" y="559" text-anchor="middle" class="small">过期 / 吊销 / 禁用</text>

  <rect x="920" y="505" width="135" height="70" class="box red"/>
  <text x="987.5" y="535" text-anchor="middle" class="label">无效</text>
  <text x="987.5" y="558" text-anchor="middle" class="small">返回 401</text>

  <rect x="640" y="650" width="190" height="62" class="box"/>
  <text x="735" y="675" text-anchor="middle" class="label">组装 CurrentUser</text>
  <text x="735" y="697" text-anchor="middle" class="small">用户 / 团队 / 权限码</text>

  <rect x="640" y="775" width="190" height="62" class="box purple"/>
  <text x="735" y="800" text-anchor="middle" class="label">写入 Redis</text>
  <text x="735" y="822" text-anchor="middle" class="small">设置短 TTL</text>

  <rect x="400" y="870" width="190" height="62" class="box"/>
  <text x="495" y="895" text-anchor="middle" class="label">放入 Gin Context</text>
  <text x="495" y="917" text-anchor="middle" class="small">currentUser</text>

  <rect x="150" y="870" width="190" height="62" class="box blue"/>
  <text x="245" y="895" text-anchor="middle" class="label">进入业务接口</text>
  <text x="245" y="917" text-anchor="middle" class="small">service / repository</text>

  <!-- horizontal request path -->
  <path d="M290 236 L370 236" class="line"/>
  <path d="M580 236 L670 236" class="line"/>

  <!-- cache hit path: right then down to context -->
  <path d="M825 236 L930 236" class="line"/>
  <text x="865" y="218" class="note">命中</text>
  <path d="M1015 267 L1015 900 L590 900" class="line"/>

  <!-- miss path: straight down -->
  <path d="M747.5 277 L747.5 360" class="line"/>
  <text x="760" y="323" class="note">未命中</text>
  <path d="M740 438 L735 505" class="line"/>
  <path d="M830 544 L920 544" class="line"/>
  <text x="860" y="526" class="note">无效</text>
  <path d="M735 583 L735 650" class="line"/>
  <text x="750" y="623" class="note">有效</text>
  <path d="M735 712 L735 775" class="line"/>
  <path d="M640 806 C555 808 500 825 495 870" class="line"/>
  <path d="M400 901 L340 901" class="line"/>
</svg>
