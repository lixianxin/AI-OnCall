<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="860" viewBox="0 0 1100 860">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 z" fill="#334155"/>
    </marker>
    <style>
      .bg{fill:#ffffff}
      .box{fill:#ffffff;stroke:#94a3b8;stroke-width:1.5;rx:12}
      .blue{fill:#eff6ff;stroke:#2563eb}
      .green{fill:#ecfdf5;stroke:#16a34a}
      .red{fill:#fef2f2;stroke:#dc2626}
      .yellow{fill:#fffbeb;stroke:#d97706}
      .label{font:600 18px 'Microsoft YaHei',Arial,sans-serif;fill:#111827}
      .small{font:400 14px 'Microsoft YaHei',Arial,sans-serif;fill:#475569}
      .line{stroke:#334155;stroke-width:1.8;fill:none;marker-end:url(#arrow)}
      .note{font:400 14px 'Microsoft YaHei',Arial,sans-serif;fill:#334155}
    </style>
  </defs>
  <rect width="1100" height="860" class="bg"/>

  <!-- login flow -->
  <rect x="60" y="45" width="135" height="58" class="box blue"/>
  <text x="127.5" y="80" text-anchor="middle" class="label">登录</text>

  <rect x="250" y="45" width="165" height="58" class="box"/>
  <text x="332.5" y="80" text-anchor="middle" class="label">账号密码校验</text>

  <rect x="470" y="45" width="170" height="58" class="box"/>
  <text x="555" y="80" text-anchor="middle" class="label">生成随机 Token</text>

  <rect x="695" y="45" width="185" height="58" class="box green"/>
  <text x="787.5" y="80" text-anchor="middle" class="label">写入 auth_sessions</text>

  <rect x="935" y="45" width="140" height="58" class="box blue"/>
  <text x="1005" y="70" text-anchor="middle" class="label">返回客户端</text>
  <text x="1005" y="91" text-anchor="middle" class="small">Bearer Token</text>

  <path d="M195 74 L250 74" class="line"/>
  <path d="M415 74 L470 74" class="line"/>
  <path d="M640 74 L695 74" class="line"/>
  <path d="M880 74 L935 74" class="line"/>

  <line x1="60" y1="155" x2="1040" y2="155" stroke="#e2e8f0" stroke-width="2"/>

  <!-- request flow -->
  <rect x="95" y="210" width="210" height="62" class="box blue"/>
  <text x="200" y="235" text-anchor="middle" class="label">后续请求携带 Token</text>
  <text x="200" y="257" text-anchor="middle" class="small">Authorization: Bearer ...</text>

  <rect x="405" y="200" width="280" height="82" class="box green"/>
  <text x="545" y="230" text-anchor="middle" class="label">查 PostgreSQL</text>
  <text x="545" y="254" text-anchor="middle" class="small">session / 用户 / 权限 / 团队</text>

  <rect x="790" y="200" width="185" height="82" class="box yellow"/>
  <text x="882.5" y="230" text-anchor="middle" class="label">token 是否有效</text>
  <text x="882.5" y="254" text-anchor="middle" class="small">过期 / 吊销 / 禁用</text>

  <rect x="790" y="385" width="185" height="66" class="box red"/>
  <text x="882.5" y="413" text-anchor="middle" class="label">无效</text>
  <text x="882.5" y="436" text-anchor="middle" class="small">返回 401</text>

  <rect x="500" y="385" width="195" height="66" class="box"/>
  <text x="597.5" y="413" text-anchor="middle" class="label">组装 CurrentUser</text>
  <text x="597.5" y="436" text-anchor="middle" class="small">用户 / 团队 / 权限码</text>

  <rect x="500" y="555" width="195" height="66" class="box"/>
  <text x="597.5" y="583" text-anchor="middle" class="label">放入 Gin Context</text>
  <text x="597.5" y="606" text-anchor="middle" class="small">currentUser</text>

  <rect x="500" y="720" width="195" height="66" class="box blue"/>
  <text x="597.5" y="748" text-anchor="middle" class="label">进入业务接口</text>
  <text x="597.5" y="771" text-anchor="middle" class="small">service / repository</text>

  <path d="M305 241 L405 241" class="line"/>
  <path d="M685 241 L790 241" class="line"/>

  <path d="M882.5 282 L882.5 385" class="line"/>
  <text x="897" y="340" class="note">无效</text>

  <path d="M790 241 C735 280 675 335 625 385" class="line"/>
  <text x="700" y="325" class="note">有效</text>

  <path d="M597.5 451 L597.5 555" class="line"/>
  <path d="M597.5 621 L597.5 720" class="line"/>
</svg>
