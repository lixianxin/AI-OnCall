spring:
  application:
    name: ai-service

server:
  port: 8081

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [traceId=%X{traceId:-}] - %msg%n"
  level:
    com.oncall.ai: DEBUG
    reactor.netty: INFO

deepseek:
  # 优先读环境变量 DEEPSEEK_API_KEY（生产/容器）；默认值为占位符，本地开发请通过环境变量注入
  api-key: ${DEEPSEEK_API_KEY:replace-me}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  model: ${DEEPSEEK_MODEL:deepseek-chat}
  # 分级降级第二级：备用模型链路。主链路重试耗尽后切换（独立凭据/额度，最多 2 次尝试）。
  # 备用也失败时由编排层返回基于工具证据的部分诊断结论（第三级）。留空 = 未配置备用链路。
  backup:
    base-url: ${DEEPSEEK_BACKUP_BASE_URL:}
    model: ${DEEPSEEK_BACKUP_MODEL:deepseek-chat}
    api-key: ${DEEPSEEK_BACKUP_API_KEY:}   # 留空则沿用主 key
  # 上游错误分级退避重试（仅对 429/5xx/连接失败生效；其他 4xx 与流式输出开始后的异常不重试）
  # max-attempts: 总尝试次数（含首次）；budget-ms: 所有重试共享的总时间预算；
  # base-delay-ms: 指数退避基数（Retry-After 头存在时优先遵循上游指示）
  retry:
    max-attempts: 3
    budget-ms: 30000
    base-delay-ms: 1000

oncall:
  docs-path: ${ONCALL_DOCS_PATH:./docs}
  # 会话持久化（SQLite 写透）：重启后会话历史/摘要/已处理消息标识可恢复。
  # 存储故障自动降级为纯内存模式（ERROR 日志），不阻塞对话主链路。
  db-path: ${ONCALL_DB_PATH:./data/aioncall.db}
  # 远程知识库地址。配置后启动时自动下载到 docs-path 目录，覆盖本地文件。
  # 支持两种模式：
  #   1. 单个 .md 文件 URL：直接下载该文件
  #   2. Manifest URL：返回文本，每行一个 .md 文件 URL（如 GitLab Raw 目录索引）
  docs-remote-url: ${ONCALL_DOCS_REMOTE_URL:}

# Actuator：暴露 Prometheus 抓取端点（/actuator/prometheus）供监控系统采集。
# 自定义 /metrics JSON 端点保持不变（人工排查用）；Prometheus 用 actuator 端点。
# 注意：标签只用低基数字段（tool/status/reason），trace_id 等请求级信息归日志不归指标。
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: always
