spring:
  application:
    name: ai-service

server:
  port: 8081

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [traceId=%X{traceId:-}] - %msg%n"
  level:
    com.oncall.ai: DEBUG
    reactor.netty: INFO

deepseek:
  # 优先读环境变量 DEEPSEEK_API_KEY（生产/容器）；默认值为占位符，本地开发请通过环境变量注入
  api-key: ${DEEPSEEK_API_KEY:replace-me}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  model: ${DEEPSEEK_MODEL:deepseek-chat}

