name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build & Unit Tests (Tool Runtime 治理链 9 项)
        working-directory: ai-service
        run: ./gradlew test --console=plain

      - name: Eval scripts syntax check
        working-directory: eval
        run: |
          python3 -m py_compile evaluate.py compare.py generate_dataset.py generate_dataset_v2.py

      - name: Eval dataset generation check (可复现性)
        working-directory: eval
        run: |
          python3 generate_dataset.py > /tmp/d1.jsonl
          python3 generate_dataset_v2.py > /tmp/d2.jsonl
          echo "v1 lines: $(wc -l < /tmp/d1.jsonl), v2 lines: $(wc -l < /tmp/d2.jsonl)"
          test "$(wc -l < /tmp/d1.jsonl)" -eq 200
          test "$(wc -l < /tmp/d2.jsonl)" -eq 200

      - name: Eval caliber consistency (口径守护)
        working-directory: eval
        run: python3 recheck_baseline_caliber.py results/baseline.json
